services:
  - type: web
    name: bite-and-sips-api
    runtime: docker
    plan: free
    disk:
      name: bs-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://your-frontend-url
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false
